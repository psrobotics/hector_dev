[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bipedal_pg" 
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["hector_pg*", "bai_pg*"]

[tool.black]
target-version = ['py311']

# include your XML/assets in the wheel
[tool.setuptools.package-data]
hector_pg = ["xmls/*.xml", "xmls/**/*.xml", "assets/**/*"]
bai_pg = ["xmls/*.xml", "xmls/**/*.xml", "assets/**/*"]
